name: CashMind

options:
  bundleIdPrefix: com.cashmind
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  CashMind:
    type: application
    platform: iOS
    sources:
      - path: CashMind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cashmind.app
        INFOPLIST_FILE: CashMind/Info.plist
        CODE_SIGN_ENTITLEMENTS: CashMind/CashMind.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
