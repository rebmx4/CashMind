name: CashMind

options:
  bundleIdPrefix: com.cashmind
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"

targets:
  CashMind:
    type: application
    platform: iOS
    sources:
      - path: CashMind
    dependencies:
      - target: CashMindWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cashmind.app
        INFOPLIST_FILE: CashMind/Info.plist
        CODE_SIGN_ENTITLEMENTS: CashMind/CashMind.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  CashMindWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CashMindWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cashmind.app.widget
        INFOPLIST_FILE: CashMindWidget/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SKIP_INSTALL: YES
