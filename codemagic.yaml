workflows:
  diagnose-signing:
    name: Diagnose Signing (read-only)
    max_build_duration: 10
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: cashminds
    scripts:
      - name: List all distribution certificates with details
        script: |
          echo "=== ALL DISTRIBUTION CERTIFICATES ==="
          app-store-connect certificates list \
            --certificate-type DISTRIBUTION \
            --json | python3 -m json.tool || true
          echo ""
          echo "=== LEGACY iOS DISTRIBUTION CERTIFICATES ==="
          app-store-connect certificates list \
            --certificate-type IOS_DISTRIBUTION \
            --json | python3 -m json.tool || true
      - name: List provisioning profiles for Telomer
        script: |
          echo "=== TELOMER PROVISIONING PROFILES ==="
          app-store-connect profiles list \
            --bundle-id-identifier com.telomer.app \
            --profile-type IOS_APP_STORE \
            --json | python3 -m json.tool || true
      - name: List provisioning profiles for CashMind
        script: |
          echo "=== CASHMIND PROVISIONING PROFILES ==="
          app-store-connect profiles list \
            --bundle-id-identifier com.cashmind.app \
            --profile-type IOS_APP_STORE \
            --json | python3 -m json.tool || true
      - name: Cross-reference Telomer profile → cert
        script: |
          echo "=== Который CERT используется TELOMER ==="
          # Profile ID → fetch внутри какой certificate привязан
          PROFILE_IDS=$(app-store-connect profiles list \
            --bundle-id-identifier com.telomer.app \
            --profile-type IOS_APP_STORE \
            --json | python3 -c "import sys,json; [print(p['id']) for p in json.load(sys.stdin)]" 2>/dev/null || true)
          for pid in $PROFILE_IDS; do
            echo "--- Profile $pid ---"
            app-store-connect profiles get "$pid" --json | python3 -m json.tool || true
          done

  ios-app-store:
    name: CashMind iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: cashminds
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "CashMind"
        BUNDLE_ID: "com.cashmind.app"
        APP_APPLE_ID: "6762206089"
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate

      - name: Initialize keychain
        script: keychain initialize

      - name: Generate certificate private key
        script: |
          # Apple Distribution Certificate требует приватный ключ при создании через API.
          # RSA 2048 — стандарт для Apple distribution. Codemagic CLI читает его
          # из env var CERTIFICATE_PRIVATE_KEY (новая версия CLI без --certificate-key-path флага).
          openssl genrsa 2048 > /tmp/cashmind_priv.pem
          echo "CERTIFICATE_PRIVATE_KEY=$(cat /tmp/cashmind_priv.pem | base64 | tr -d '\n')" >> $CM_ENV
          echo "Private key generated and exported to CERTIFICATE_PRIVATE_KEY env."

      - name: Fetch / create signing files for main app
        script: |
          # Расшифруем base64 обратно перед использованием
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 -d > /tmp/priv.pem
          export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/priv.pem)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Fetch / create signing files for widget extension
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 -d > /tmp/priv.pem
          export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/priv.pem)
          app-store-connect fetch-signing-files "${BUNDLE_ID}.widget" \
            --type IOS_APP_STORE \
            --create

      - name: Install certificates into keychain
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 -d > /tmp/priv.pem
          export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/priv.pem)
          keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR"
          LATEST_RAW=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "")
          LATEST_BUILD=$(echo "$LATEST_RAW" | grep -o '[0-9]*' | tail -1)
          LATEST_BUILD=${LATEST_BUILD:-0}
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "Build: $LATEST_BUILD -> $NEW_BUILD"
          agvtool new-version -all "$NEW_BUILD"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/CashMind.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
