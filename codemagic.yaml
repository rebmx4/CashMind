workflows:
  ios-app-store:
    name: CashMind iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: cashminds
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "CashMind"
        BUNDLE_ID: "com.cashmind.app"
        APP_APPLE_ID: "6762206089"
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate

      - name: Initialize keychain
        script: keychain initialize

      - name: Generate certificate private key
        script: |
          # Apple Distribution Certificate требует приватный ключ при создании через API.
          # Генерируем RSA 2048 — стандарт для Apple distribution.
          openssl genrsa -out /tmp/cashmind_priv.pem 2048
          echo "Private key generated."

      - name: Fetch / create signing files for main app
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key-path /tmp/cashmind_priv.pem \
            --create

      - name: Fetch / create signing files for widget extension
        script: |
          app-store-connect fetch-signing-files "${BUNDLE_ID}.widget" \
            --type IOS_APP_STORE \
            --certificate-key-path /tmp/cashmind_priv.pem \
            --create

      - name: Install certificates into keychain
        script: keychain add-certificates --certificate-key-path /tmp/cashmind_priv.pem

      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR"
          LATEST_RAW=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "")
          LATEST_BUILD=$(echo "$LATEST_RAW" | grep -o '[0-9]*' | tail -1)
          LATEST_BUILD=${LATEST_BUILD:-0}
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "Build: $LATEST_BUILD -> $NEW_BUILD"
          agvtool new-version -all "$NEW_BUILD"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/CashMind.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
